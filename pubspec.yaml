name: consulta_dominio
description: Consulta datos de un vehículo por dominio usando el estimador de costos de la DNRPA y los guarda en Google Sheets.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^0.17.1
  http: ^1.6.0
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

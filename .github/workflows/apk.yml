# Arma el instalador de Android (APK) y lo publica como una versión nueva en
# Releases. El link de descarga de siempre apunta a la última:
# https://github.com/martin-perti/consulta-dominio/releases/latest/download/consulta-dominio.apk
#
# La planilla se conecta con dos secretos del repositorio (opcionales):
# Settings > Secrets and variables > Actions > SHEETS_URL y SHEETS_TOKEN.
name: APK Android

on:
  push:
    branches: [main, prototipo-app]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Firma fija
        # Android solo deja actualizar la app si cada versión está firmada con
        # la misma clave. Sin esto, cada armado usaría una clave nueva y el
        # celular rechazaría la actualización. Si existe el secreto
        # ANDROID_KEYSTORE_BASE64 se usa ese; si no, la clave de firma/.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "ANDROID_USER_HOME=${ANDROID_USER_HOME:-} ANDROID_SDK_HOME=${ANDROID_SDK_HOME:-}"
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          else
            cp firma/debug.keystore ~/.android/debug.keystore
          fi

      - name: Generar carpeta de Android
        run: |
          flutter create --platforms android --org ar.consultadominio --project-name consulta_dominio .
          # La plantilla trae una prueba de ejemplo que no aplica a esta app.
          rm -f test/widget_test.dart
          # Permiso de internet también en la versión de release.
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          # ML Kit referencia reconocedores de otros alfabetos que no usamos;
          # sin esto R8 corta el armado del release por clases faltantes.
          printf '%s\n' \
            '-dontwarn com.google.mlkit.vision.text.chinese.**' \
            '-dontwarn com.google.mlkit.vision.text.devanagari.**' \
            '-dontwarn com.google.mlkit.vision.text.japanese.**' \
            '-dontwarn com.google.mlkit.vision.text.korean.**' \
            >> android/app/proguard-rules.pro
          # Nombre visible en el celular.
          sed -i 's|android:label="[^"]*"|android:label="Consulta dominio"|' android/app/src/main/AndroidManifest.xml

      - name: Análisis y pruebas
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Armar APK
        env:
          # Que Gradle tome la clave de ~/.android y no la de otra carpeta
          # que tenga configurada la máquina de GitHub.
          ANDROID_USER_HOME: /home/runner/.android
          SHEETS_URL: ${{ secrets.SHEETS_URL }}
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
        run: |
          # Un APK por tipo de procesador: cada uno pesa la mitad o menos que
          # el universal y se baja más fácil desde el celular. arm64 cubre
          # casi todos los Android actuales; armeabi-v7a es para equipos viejos.
          flutter build apk --release --split-per-abi \
            --build-number=${{ github.run_number }} \
            --dart-define=SHEETS_URL="$SHEETS_URL" \
            --dart-define=SHEETS_TOKEN="$SHEETS_TOKEN"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk consulta-dominio.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk consulta-dominio-equipos-viejos.apk

      - name: Comprobar la firma
        run: |
          esperada=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep 'SHA256:' | head -1 | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          real=$("$apksigner" verify --print-certs consulta-dominio.apk | grep 'SHA-256 digest' | head -1 | awk '{print $NF}')
          echo "esperada=$esperada real=$real"
          test "$esperada" = "$real"

      - uses: actions/upload-artifact@v4
        with:
          name: consulta-dominio-apk
          path: consulta-dominio*.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          # Una versión nueva por armado: así nunca se reemplaza un archivo
          # mientras alguien lo está bajando.
          tag_name: build-${{ github.run_number }}
          name: Versión ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            consulta-dominio.apk
            consulta-dominio-equipos-viejos.apk
          body: |
            Instalador de Android armado desde `${{ github.ref_name }}` (${{ github.sha }}).
            Bajá `consulta-dominio.apk` desde el celular e instalalo.
            Si el celular dice que no es compatible, usá `consulta-dominio-equipos-viejos.apk`.
